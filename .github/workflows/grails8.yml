name: Grails 8 CI

on:
  push:
    branches: [ grails8 ]
  pull_request:
    branches: [ grails8 ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: complete/backend (test + integrationTest)
    # Only complete/ has a Grails backend; initial/ is the frontend-only starting point.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit + integration tests
        working-directory: complete/backend
        run: |
          chmod +x gradlew
          ./gradlew test integrationTest --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: complete/backend/build/reports/tests/
          if-no-files-found: ignore
