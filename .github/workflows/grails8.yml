# SPDX-License-Identifier: Apache-2.0
name: Grails 8 CI

on:
  push:
    branches:
      - grails8
  pull_request:
    branches:
      - grails8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: complete
            gradle-target: ':backend:test :backend:integrationTest'
            node-version: '22'
          - directory: initial/backend
            gradle-target: 'test integrationTest'
            node-version: ''   # no frontend build needed

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        if: matrix.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit and integration tests
        run: ./gradlew ${{ matrix.gradle-target }} --console=plain --stacktrace
